# Pull credentials for ghcr.io/matthewshan/worker-versioning.
#
# `agent-harness-poc` is private and GitHub publishes a new GHCR package as private by default —
# package visibility does not inherit from the repository. Every other image this cluster runs is
# public, so this is its only registry credential. Without it the controller's worker Deployments
# sit in ImagePullBackOff.
#
# The Infisical value must be a **classic** PAT with `read:packages`. GHCR does not accept GitHub
# App installation tokens (github.com/orgs/community/discussions/171423) or fine-grained PATs, and
# the failure is misleading: `docker login` succeeds and the pull then returns `denied`. Do not
# migrate this to the ESO `githubaccesstokens` generator — it exists and looks like the right tool,
# but GHCR rejects the tokens it mints.
#
# Verified 2026-09-16: the PAT carries exactly `read:packages`, and fetching this image's manifest
# from ghcr.io with it returns HTTP 200.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  annotations:
    # Ahead of the WorkerDeployment, so the secret exists before any worker pod is scheduled.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # `auth` is the base64 of "username:token", which is what the kubelet actually sends.
        # The username is not a secret — GHCR accepts any username beside a valid PAT — so only
        # the token comes from Infisical.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"matthewshan","password":"{{ .token }}","auth":"{{ printf "matthewshan:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull-secret
