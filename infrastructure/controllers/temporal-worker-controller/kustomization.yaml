apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Each OCI chart is installed by its own Argo CD Application rather than `helmCharts:` —
# see README.md for why, and for why the sync waves below do not actually gate each other.
# Sync waves are per-resource rather than commonAnnotations, which would overwrite them.
resources:
  - ns.yaml
  - crds-app.yaml
  - controller-app.yaml
