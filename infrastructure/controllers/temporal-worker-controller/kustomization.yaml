apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Both charts are OCI-only; kustomize >= 5.2.0 pulls `oci://` repos directly (Argo CD v3.0.11
# bundles 5.6.0). One Application renders both, so Argo's kind ordering (Namespace -> CRDs -> rest)
# puts the CRDs before the manager without sync waves. See README.md.
resources:
  - ns.yaml

helmCharts:
  - name: temporal-worker-controller-crds
    repo: oci://docker.io/temporalio
    version: 0.31.0
    # Release names match the Argo CD Applications that used to install these charts, so the
    # rendered object names are unchanged and this directory adopts the live resources in place.
    releaseName: temporal-worker-controller-crds
    # Without namespace:, Helm renders into the repo-server's own namespace (argocd).
    namespace: temporal-worker-controller
    # The CRDs chart ships no values.yaml; without a valuesFile kustomize fails with
    # `evalsymlink failure on .../values.yaml`.
    valuesFile: empty-values.yaml
  - name: temporal-worker-controller
    repo: oci://docker.io/temporalio
    version: 0.31.0
    releaseName: temporal-worker-controller-manager
    namespace: temporal-worker-controller
    valuesFile: values.yaml
