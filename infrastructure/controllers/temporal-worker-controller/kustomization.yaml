apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `helmCharts:` block here on purpose — see README.md. The charts are OCI-only and
# kustomize cannot pull them, so each is installed by its own Argo CD Application.
# Sync waves are per-resource rather than commonAnnotations, which would overwrite them.
resources:
  - ns.yaml
  - crds-app.yaml
  - controller-app.yaml
