apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-worker-controller-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: infrastructure
  source:
    repoURL: registry-1.docker.io/temporalio
    chart: temporal-worker-controller
    targetRevision: 0.29.1
    helm:
      valuesObject:
        # Single node: the chart's default second replica has nowhere useful to go.
        replicas: 1
        metrics:
          # Drops the kube-rbac-proxy sidecar. Nothing outside the cluster reaches this
          # endpoint, and the node has under 1Gi of request headroom.
          disableAuth: true
        certmanager:
          # cert-manager is already an infrastructure component; only the Issuer and
          # Certificate for the always-on WorkerResourceTemplate webhook are needed.
          install: false
          enabled: true
        resources:
          requests:
            # The chart ships 10m, which crash-looped the manager roughly every
            # 16 minutes (52 restarts in 14h) on 2026-09-15. A 10m request buys a
            # negligible CFS share on a node sitting at 70% CPU requests and 655%
            # limit overcommit, so the manager could answer neither its own
            # /healthz inside the chart's livenessProbe timeoutSeconds: 1 nor
            # renew its leader-election lease inside the client's 5s deadline —
            # two independent kill paths, both starvation. Exit code was 1
            # ("leader election lost"), never 137, so memory was never the issue
            # and stays at the chart default.
            cpu: 100m
            memory: 64Mi
          limits:
            # Raised with the request: the informer cache sync at startup (100
            # WorkerDeployment workers) is the burstiest moment the manager has,
            # and it is the moment the probes are tightest. Limits do not consume
            # schedulable capacity — only requests do.
            cpu: "1"
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal-worker-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
