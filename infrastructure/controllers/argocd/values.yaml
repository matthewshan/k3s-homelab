configs:
  cm:
    create: true
    application.resourceTrackingMethod: "annotation+label"
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      if obj.status == nil then
        hs.status = "Progressing"
        hs.message = "ExternalSecret initialization pending"
        return hs
      end
      if obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ExternalSecret is Ready"
              return hs
            end
            if condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ExternalSecret is not Ready"
              return hs
            end
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for ExternalSecret Ready condition"
      return hs
    # Argo CD has no built-in health for temporal.io CRDs, so without this a WorkerDeployment
    # reports Healthy the moment it syncs -- before the rollout has started. Both conditions are
    # standard, so this never needs to know a controller-specific status field.
    resource.customizations.health.temporal.io_WorkerDeployment: |
      hs = {}
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for WorkerDeployment conditions"
        return hs
      end
      local ready = nil
      local progressing = nil
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then ready = condition end
        if condition.type == "Progressing" then progressing = condition end
      end
      if ready ~= nil and ready.status == "True" then
        hs.status = "Healthy"
        hs.message = ready.message or "Rollout complete"
        return hs
      end
      if progressing ~= nil then
        if progressing.status == "True" then
          hs.status = "Progressing"
          hs.message = progressing.message or "Rollout in progress"
        else
          hs.status = "Degraded"
          hs.message = progressing.message or "Rollout blocked"
        end
        return hs
      end
      hs.status = "Progressing"
      hs.message = "Waiting for conditions"
      return hs
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - >
          . as $crd
          | select($crd.metadata.name == "twingateresourceaccesses.twingate.com")
          | .spec.versions[]?.schema.openAPIV3Schema.properties.spec.oneOf[]?.properties
  cmp:
    create: true
    plugins:
      kustomize-build-with-helm:
        generate:
          command: [ "sh", "-c" ]
          args: [ "kustomize build --enable-helm" ]
  params:
    server.insecure: true

crds:
  install: true
  # -- Keep CRDs on chart uninstall
  keep: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 700Mi
    limits:
      cpu: 4000m
      memory: 2Gi

dex:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 2000m
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 4000m
      memory: 256Mi

repoServer:
  containerSecurityContext:
    readOnlyRootFilesystem: true
  volumes:
    - name: cmp-kustomize-build-with-helm
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 1024Mi
  extraContainers:
    - name: kustomize-build-with-helm
      command:
        - argocd-cmp-server
      image: '{{ default .Values.global.image.repository .Values.repoServer.image.repository }}:{{ default (include "argo-cd.defaultTag" .) .Values.repoServer.image.tag }}'
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ "ALL" ]
      volumeMounts:
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-kustomize-build-with-helm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: kustomize-build-with-helm.yaml
        - mountPath: /tmp
          name: cmp-tmp

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi

notifications:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 128Mi
