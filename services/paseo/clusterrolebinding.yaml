# Read-only cluster access for agents. Bind ONLY the built-in `view` role: it
# excludes Secrets and pods/exec, pods/portforward and */proxy, which would
# otherwise let an agent read every credential or step around the
# CiliumNetworkPolicy. Never bind edit/admin/cluster-admin here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paseo-view
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: paseo
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
