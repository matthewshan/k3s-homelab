apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
  namespace: paseo
  labels:
    app.kubernetes.io/name: paseo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo
  strategy:
    type: Recreate  # RWO volume and a single daemon identity (daemon-keypair.json)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo
    spec:
      serviceAccountName: paseo
      # Projected, short-lived token for read-only kubectl (ClusterRole `view`).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The upstream image ships no agent CLIs. Install pinned versions onto the
      # PVC instead of maintaining a child image; each step is skipped when the
      # recorded version already matches.
      initContainers:
        - name: install-cli-tools
          image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          env:
            # kubectl within one minor of the cluster (k3s v1.35.2).
            - name: KUBECTL_VERSION
              value: v1.35.10
            - name: KUBECTL_SHA256
              value: c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327
            - name: GH_VERSION
              value: "2.103.3"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              BIN=/home/paseo/.local/bin
              mkdir -p "$BIN"
              cd /tmp
              if [ "$(cat "$BIN/.kubectl-version" 2>/dev/null)" != "$KUBECTL_VERSION" ]; then
                wget -qO kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
                echo "$KUBECTL_SHA256  kubectl" | sha256sum -c -
                cp kubectl "$BIN/kubectl" && chmod 0755 "$BIN/kubectl"
                echo "$KUBECTL_VERSION" > "$BIN/.kubectl-version"
              fi
              if [ "$(cat "$BIN/.gh-version" 2>/dev/null)" != "$GH_VERSION" ]; then
                base="https://github.com/cli/cli/releases/download/v$GH_VERSION"
                tarball="gh_${GH_VERSION}_linux_amd64.tar.gz"
                wget -q "$base/$tarball"
                wget -q "$base/gh_${GH_VERSION}_checksums.txt"
                grep " $tarball\$" "gh_${GH_VERSION}_checksums.txt" | sha256sum -c -
                tar -xzf "$tarball"
                cp "gh_${GH_VERSION}_linux_amd64/bin/gh" "$BIN/gh" && chmod 0755 "$BIN/gh"
                echo "$GH_VERSION" > "$BIN/.gh-version"
              fi
          volumeMounts:
            - name: home
              mountPath: /home/paseo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: install-claude-code
          image: ghcr.io/getpaseo/paseo:0.15.4@sha256:d9c05730c66a6b64a708303e7cfa6a4009f31f89507bf986fb5b098af25a1c3f
          env:
            - name: HOME
              value: /home/paseo
            - name: CLAUDE_CODE_VERSION
              value: "2.1.322"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              BIN=/home/paseo/.local/bin
              if [ "$(cat "$BIN/.claude-code-version" 2>/dev/null)" != "$CLAUDE_CODE_VERSION" ]; then
                npm install -g --prefix /home/paseo/.local "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
                echo "$CLAUDE_CODE_VERSION" > "$BIN/.claude-code-version"
              fi
          volumeMounts:
            - name: home
              mountPath: /home/paseo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: paseo
          # >= 0.5.0 is required: GHSA-2xhx-c69r-qj4j (relay E2EE bypass).
          image: ghcr.io/getpaseo/paseo:0.15.4@sha256:d9c05730c66a6b64a708303e7cfa6a4009f31f89507bf986fb5b098af25a1c3f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6767
          env:
            - name: HOME
              value: /home/paseo
            - name: PATH
              value: /home/paseo/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: PASEO_HOSTNAMES
              value: paseo.mattshan.dev
            # Keep the pinned Claude Code version; bump it in install-claude-code.
            - name: DISABLE_AUTOUPDATER
              value: "1"
            # git authenticates to GitHub with GH_TOKEN at call time, so the
            # token is never written into a git config file on the PVC.
            - name: GIT_CONFIG_COUNT
              value: "3"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
            - name: GIT_CONFIG_KEY_1
              value: user.name
            - name: GIT_CONFIG_VALUE_1
              value: Paseo agent
            - name: GIT_CONFIG_KEY_2
              value: user.email
            - name: GIT_CONFIG_VALUE_2
              value: paseo@homelab.invalid
          envFrom:
            - secretRef:
                name: paseo-secrets
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: home
              mountPath: /workspace
              subPath: workspace
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: paseo-home
      restartPolicy: Always
