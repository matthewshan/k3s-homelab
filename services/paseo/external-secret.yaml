apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
  namespace: paseo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: paseo-secrets
    creationPolicy: Owner
  # Everything here is readable by every agent in the pod. Keep it to these
  # keys and never reuse another app's credentials (see README).
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo-password
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: paseo-claude-code-oauth-token
---
# Separate from paseo-secrets on purpose: an ExternalSecret fails as a whole
# when any remote key is missing, so a missing or deleted Linear key must not
# stop the password and Claude token from refreshing. The pod consumes it with
# `optional: true`. No sync wave: a failed sync here must not hold up the
# Deployment either. Readable by every agent, like the keys above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-linear
  namespace: paseo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: paseo-linear
    creationPolicy: Owner
  data:
    - secretKey: LINEAR_API_KEY
      remoteRef:
        key: paseo-linear-api-key
