apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
  namespace: paseo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: paseo-secrets
    creationPolicy: Owner
  # Everything here is readable by every agent in the pod. Keep it to these
  # three keys and never reuse another app's credentials (see README).
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo-password
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: paseo-claude-code-oauth-token
    - secretKey: GH_TOKEN
      remoteRef:
        key: paseo-gh-token
