apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-postgres-provision
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      initContainers:
        # The chart's own DB bootstrap is unavailable here: the shared PostgreSQL
        # PVC already exists, so `primary.initdb.scripts` never replays.
        - name: wait-for-langfuse-secrets
          image: registry.k8s.io/kubectl:v1.35.2
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
            - -n
            - langfuse
            - wait
            - --for=condition=Ready
            - externalsecret/langfuse-secrets
            - --timeout=600s
      containers:
        - name: provision
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgresql.postgresql.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: postgres-admin-password
            - name: LANGFUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: postgres-password
          command:
            - sh
            - -ec
            - |
              # Idempotent: safe to re-run on every sync. `\gexec` is used because
              # CREATE DATABASE cannot run inside a DO block or transaction.
              psql -v ON_ERROR_STOP=1 -v pw="$LANGFUSE_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE langfuse LOGIN PASSWORD %L', :'pw')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse')\gexec

              ALTER ROLE langfuse WITH LOGIN PASSWORD :'pw';

              SELECT 'CREATE DATABASE langfuse OWNER langfuse'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'langfuse')\gexec
              SQL
      serviceAccountName: langfuse-secret-ready-gate
