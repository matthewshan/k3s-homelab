apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-secret-ready-gate
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: langfuse-secret-ready-gate
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: langfuse-secret-ready-gate
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: langfuse-secret-ready-gate
    namespace: langfuse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: langfuse-secret-ready-gate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-secret-ready-gate
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: langfuse-secret-ready-gate
      restartPolicy: Never
      initContainers:
        - name: wait-for-langfuse-secrets-externalsecret
          image: registry.k8s.io/kubectl:v1.35.2
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
            - -n
            - langfuse
            - wait
            - --for=condition=Ready
            - externalsecret/langfuse-secrets
            - --timeout=600s
      containers:
        - name: verify-langfuse-secrets
          image: registry.k8s.io/kubectl:v1.35.2
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
            - -n
            - langfuse
            - get
            - secret
            - langfuse-secrets
