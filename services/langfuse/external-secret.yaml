apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    # Password for the `langfuse` user on the shared PostgreSQL service.
    - secretKey: postgres-password
      remoteRef:
        key: langfuse-postgres-user-password
    # Shared-instance superuser, used only by postgres-provision-job.yaml to
    # create the `langfuse` role and database. Langfuse itself never reads it.
    - secretKey: postgres-admin-password
      remoteRef:
        key: postgres-admin-password
    # NextAuth session signing secret.
    - secretKey: nextauth-secret
      remoteRef:
        key: langfuse-nextauth-secret
    # Salt for hashing API keys.
    - secretKey: salt
      remoteRef:
        key: langfuse-salt
    # 32-byte hex key encrypting stored LLM API keys. Rotating it orphans that data.
    - secretKey: encryption-key
      remoteRef:
        key: langfuse-encryption-key
    # Bundled ClickHouse (trace store).
    - secretKey: clickhouse-password
      remoteRef:
        key: langfuse-clickhouse-password
    # Bundled Valkey (queue/cache).
    - secretKey: redis-password
      remoteRef:
        key: langfuse-redis-password
    # Bundled MinIO (event/blob storage). The chart requires both user and
    # password keys whenever `s3.auth.existingSecret` is set.
    - secretKey: minio-root-user
      remoteRef:
        key: langfuse-minio-root-user
    - secretKey: minio-root-password
      remoteRef:
        key: langfuse-minio-root-password
